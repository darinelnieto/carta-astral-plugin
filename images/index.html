<script type="text/javascript">
    function validateForm() {
        var x = document.myForm.year.value;
        var y = document.myForm.era.value;
        var v = x*y;
        if (v < -10000 || v > 10000) {
            alert("Year out of range (only from 10000 B.C. to 10000 A.D.).");
            return false;
        } else {
            return true;
        }
    }
function convertDMS( lat, lng , tz , loc ) { 
        var convertLat = Math.abs(lat);
        var LatDeg = Math.floor(convertLat);
        var LatMin = (Math.floor((convertLat - LatDeg) * 60));
        var LatCardinal = ((lat > 0) ? 1 : -1);         
        var convertLng = Math.abs(lng);
        var LngDeg = Math.floor(convertLng);
        var LngMin = (Math.floor((convertLng - LngDeg) * 60));
        var LngCardinal = ((lng > 0) ? 1 : -1); 

        document.getElementById("lat_deg").value=LatDeg;
        document.getElementById("lat_min").value=LatMin;
        document.getElementById("long_deg").value=LngDeg;
        document.getElementById("long_min").value=LngMin;
        document.getElementById("ns").value=LatCardinal;
        document.getElementById("ew").value=LngCardinal;
        document.getElementById("timezone").value=tz;
        document.getElementById("full_name").value=loc;
        document.getElementById("zoneoffset").value="99";
return;        
}
$(function () {
    var getData = function (request, response) {
        $.getJSON(
            "data/getautocomplete.php?jsonp=?",
            {
             term: request.term,
             country_id: myForm.country_id.value,
             atlas: myForm.atlas.value
            },            
            function (data) {
                response(data);
            });
    };
    var selectItem = function (event, ui) {
        $("#cname").val(ui.item.value);
        $("#full_name").val(ui.item.label);
        $("#latitude").val(ui.item.latitude);
        $("#longitude").val(ui.item.longitude);
        $("#timezone").val(ui.item.timezone);
        convertDMS( ui.item.latitude, ui.item.longitude, ui.item.timezone , ui.item.label );
        return false;
    } 
    $("#cname").autocomplete({
        source: getData,
        select: selectItem,
        minLength: 3,
        change: function() {
            /* */
        }
    });
});</script>

function fixto360(ang){
	while (ang < 0) {
    ang += 360;
  }
  while (ang >= 360) {
    ang -= 360;
  }
  return ang;
}
function fixtoRAD(ang){
	var p2 = 2*(Math.PI);
	while (ang < 0) {
    ang += p2;
  }
  while (ang >= p2) {
    ang -= p2;
  }
  return ang;
}
	
	
function cjd(d, m, y) { 
    var a, j, l; 
    var b; 
    if (m < 3) { 
        m += 12; 
        y-- 
    }
    a = y / 100; 
    b = parseFloat(30.6) * parseFloat(m + 1); 
    l = parseInt(b); 
    j = 365 * y + y / 4 + l + 2 - a + a / 4 + d; 
    return j 
}	
function calculateB6(d, m, y) { 
    var h, mt, s, h6, b6, timeZone; 
    h = 12; 
    mt = 0; 
    s = 0; 
    timeZone = 0; 
    h6 = (h + mt / 60 + s / 3600 - (12 + timeZone)) / 24;
    jd = cal_to_jd( 1, y, m, d, h6, mt, s ) ;
    b6 = (cjd(d,m,y) - 694025 + h6) / 36525; 
    return b6 ;
}

//-----------------------------------------------------------------------------
// convert calendar to Julian date
//-----------------------------------------------------------------------------
function cal_to_jd( era, y, m, d, h, mn, s )
{
	var jy, ja, jm;			//scratch

	if( y == 0 ) {
		alert("There's no zero year!");
        return "invalid";
    }
    if( y == 1582 && m == 10 && d > 4 && d < 15 && era == "CE") {
		alert("Dates between 5 and 14 October 1582 AD do not exist in the gregorian system!");
        return "invalid";
    }

//	if( y < 0 )  ++y;
  
  var jd;
  var u, u0, u1, u2;
  var temp;
  
  u2=0;

  temp = y + m/100 + d/10000;

  if( era == "BCE" ) {
  y = -y + 1;
  temp = -temp+1;
  }
    
  u = y;
  if (m < 3) {
  u -=1;
  }
  u0 = u + 4712.0;
  u1 = m + 1.0;
  if (u1 < 4) {
  u1 += 12.0;
  }
  jd = Math.floor(u0*365.25) + Math.floor(30.6*u1+0.000001) + d + h/24.0 + mn/24.0/60 + s/24.0/3600 - 63.5;
  
  if (temp >= 1582.1015) {
    u2 = Math.floor(Math.abs(u) / 100) - Math.floor(Math.abs(u) / 400);
    if (u < 0.0) u2 = -u2;
    jd += - u2 + 2;            
    if ((u < 0.0) && (u/100 == Math.floor(u/100)) && (u/400 != Math.floor(u/400))) jd -=1;
  }
  
  return jd; //Math.floor(jd*100000+0.5)/100000;
}

//-----------------------------------------------------------------------------
// convert Julian date to calendar date
//-----------------------------------------------------------------------------
function jd_to_cal( jd, form )
{

  var jd0, u0, u1, u2, u3, u4, jyear, jmon, jday, hr, mn, sc, hrfrac, mnfrac;
  u0=0;
  u1=0;
  u2=0;
  u3=0;
  u4=0;
  
  jd0 = eval(jd);
   
  u0 =  jd0 + 32082.5;
  //alert(u0);
  if (jd0 > 2299160) {
    u1 = u0 + Math.floor (u0/36525.0) - Math.floor (u0/146100.0) - 38.0;
    if (jd0 >= 1830691.5) u1 +=1;
    u0 = u0 + Math.floor (u1/36525.0) - Math.floor (u1/146100.0) - 38.0;
  }
  
  u2 = Math.floor (u0 + 123.0);
  u3 = Math.floor ( (u2 - 122.2) / 365.25);
  u4 = Math.floor ( (u2 - Math.floor (365.25 * u3) ) / 30.6001);
  jmon = (u4 - 1.0);
  if (jmon > 12) jmon -= 12;
  jday = (u2 - Math.floor (365.25 * u3) - Math.floor (30.6001 * u4));
  jyear = (u3 + Math.floor ( (u4 - 2.0) / 12.0) - 4800);
  hrfrac = (jd0 - Math.floor (jd0 + 0.5) + 0.5) * 24.0;
  
  hr = Math.floor(hrfrac);
  mnfrac = (hrfrac - hr)*60;
  mn = Math.floor(mnfrac);
  sc = Math.floor((mnfrac - mn)*60 + 0.5);
  
  if (sc == 60){
  sc=0;
  mn += 1;
  }
  if (mn == 60){
  mn=0;
  hr += 1;
  }
    
    if( jyear <= 0 ) {
     	jyear = -jyear + 1;
        form.era[1].checked = true;
    } else {
        form.era[0].checked = true;
    }

    form.year.value        = jyear;
    form.month[jmon-1].selected = true;
    form.day[jday-1].selected   = jday;
    form.hour.value        = hr;
    form.minute.value      = mn;
    form.second.value      = sc;
}

		function HAspect(pp1, pp2){
		/*
		var aspect = { 
		"conjunction":{"degree":0, "orbit":10, "color":"transparent"},

		};
		*/
		
		var aspects = [0,30,60,90,120,150,180];
		var orbs = [10,8,8,8,8,8,10];	
			
			
		var result = -1;
		
		var dif = Math.abs( pp1 - pp2 );

			dif = 360 - dif;
		}
		
		//aspects[aspect]
		for (i1=0;i1<7;i1++) {

		var orbe = Math.abs(dif - aspects[i1]);
		
		if(orbe <= orbs[i1]){
		//if(aspects[i1]+orbs[i1]-dif >= 0){
			//alert(pp1 + " " + pp2 + " " + dif + " " +orbe);											
			result = i1;
			return result;
		}
	  
	  }
	  						
		return result;	
	  }
